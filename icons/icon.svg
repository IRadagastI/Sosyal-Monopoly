<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Arka plan: koyu mavi, hafif ışıkli premium gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>

    <!-- Tahta kose kareleri icin renkler (uygulama unite paleti) -->
    <linearGradient id="tileGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="tileBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tileOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tilePurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Altin kart / zar yuzeyi -->
    <linearGradient id="goldCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="diceFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="bookPage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Golge ve parlama filtreleri -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="tileShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ana arka plan -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>

  <!-- Tahta cercevesi -->
  <rect x="34" y="34" width="444" height="444" rx="44" fill="none" stroke="#475569" stroke-width="6" opacity="0.55"/>
  <rect x="48" y="48" width="416" height="416" rx="36" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.22"/>

  <!-- Kose kareleri: tahta oyunu hissi -->
  <g filter="url(#tileShadow)">
    <rect x="52" y="52" width="86" height="86" rx="14" fill="url(#tileGreen)"/>
    <rect x="52" y="52" width="86" height="22" rx="14" fill="#ffffff" opacity="0.18"/>
    <rect x="374" y="52" width="86" height="86" rx="14" fill="url(#tileBlue)"/>
    <rect x="374" y="52" width="86" height="22" rx="14" fill="#ffffff" opacity="0.18"/>
    <rect x="52" y="374" width="86" height="86" rx="14" fill="url(#tilePurple)"/>
    <rect x="52" y="374" width="86" height="22" rx="14" fill="#ffffff" opacity="0.18"/>
    <rect x="374" y="374" width="86" height="86" rx="14" fill="url(#tileOrange)"/>
    <rect x="374" y="374" width="86" height="22" rx="14" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- Merkez kompozisyon -->
  <g transform="translate(256 252)">
    <!-- Dunya: Sosyal Bilgiler temasi -->
    <circle cx="0" cy="-8" r="98" fill="none" stroke="#38bdf8" stroke-width="3.5" opacity="0.32"/>
    <ellipse cx="0" cy="-8" rx="38" ry="98" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.24"/>
    <ellipse cx="0" cy="-8" rx="78" ry="28" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.2"/>
    <line x1="-98" y1="-8" x2="98" y2="-8" stroke="#38bdf8" stroke-width="2.5" opacity="0.22"/>

    <!-- Acik kitap -->
    <g filter="url(#softShadow)">
      <path d="M-78 42 C-40 24, -8 24, 0 34 C8 24, 40 24, 78 42 L78 88 C40 72, 8 72, 0 82 C-8 72, -40 72, -78 88 Z" fill="url(#bookPage)"/>
      <path d="M0 34 L0 82" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <path d="M-58 52 C-28 40, -10 40, 0 48" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M58 52 C28 40, 10 40, 0 48" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <!-- Altin bilgi karti + B harfi -->
    <g filter="url(#softShadow)">
      <rect x="-72" y="-74" width="144" height="144" rx="28" fill="url(#goldCard)"/>
      <rect x="-72" y="-74" width="144" height="34" rx="28" fill="#ffffff" opacity="0.22"/>
      <text x="0" y="18" text-anchor="middle" font-family="Segoe UI, Arial Black, sans-serif" font-size="92" font-weight="900" fill="#0f172a">B</text>
    </g>

    <!-- Zar: oyun vurgusu -->
    <g transform="translate(58 -92) rotate(12)" filter="url(#softShadow)">
      <rect x="0" y="0" width="74" height="74" rx="16" fill="url(#diceFace)"/>
      <circle cx="22" cy="22" r="7" fill="#1e293b"/>
      <circle cx="52" cy="22" r="7" fill="#1e293b"/>
      <circle cx="37" cy="37" r="7" fill="#1e293b"/>
      <circle cx="22" cy="52" r="7" fill="#1e293b"/>
      <circle cx="52" cy="52" r="7" fill="#1e293b"/>
    </g>

    <!-- Mezuniyet sapkasi: egitim detayi -->
    <g transform="translate(-88 -108) rotate(-8)" filter="url(#glow)">
      <polygon points="0,18 54,34 27,52" fill="#0f172a"/>
      <rect x="8" y="8" width="38" height="12" rx="3" fill="#0f172a"/>
      <path d="M27 52 L27 68" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
      <circle cx="27" cy="70" r="5" fill="#fbbf24"/>
    </g>
  </g>
</svg>
